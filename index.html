<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>XAUUSDT Heatmap Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #06080d;
      color: #eaecef;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #0e121a;
      border-bottom: 1px solid #1a202c;
    }
    .left-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #1e2638;
      color: #ffd700;
      font-weight: 700;
      border: 1px solid #334155;
    }
    select {
      background: #141b2d;
      color: #00f0ff;
      border: 1px solid #2d3748;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      outline: none;
    }
    .price-tag {
      font-size: 16px;
      font-weight: bold;
      color: #00ff88;
      font-family: monospace;
    }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 52px);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #legend {
      position: absolute;
      bottom: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #94a3b8;
      background: rgba(6, 8, 13, 0.85);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }
    .gradient-bar {
      width: 55px;
      height: 6px;
      border-radius: 2px;
      background: linear-gradient(to right, #001f3f, #0074d9, #2ecc40, #ffdc00, #ff4136);
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="left-controls">
      <span class="badge">Binance XAUUSDT</span>
      <select id="timeframe-select">
        <option value="1">Tick (Live)</option>
        <option value="60">1 Min</option>
        <option value="300" selected>5 Min</option>
        <option value="900">15 Min</option>
      </select>
      <span id="status" style="font-size: 10px; color: #f59e0b;">Starting...</span>
    </div>
    <div class="price-tag" id="last-price">Fetching...</div>
  </div>

  <div id="canvas-container">
    <canvas id="heatmapCanvas"></canvas>
    <div id="legend">
      <span>Low Liq</span>
      <div class="gradient-bar"></div>
      <span>Whale Wall</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('heatmapCanvas');
    const ctx = canvas.getContext('2d');
    const priceDisplay = document.getElementById('last-price');
    const statusLabel = document.getElementById('status');
    const tfSelect = document.getElementById('timeframe-select');

    let width = 0, height = 0;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight - 52;
    }
    window.addEventListener('resize', resize);
    resize();

    let bucketSec = parseInt(tfSelect.value, 10);
    tfSelect.addEventListener('change', (e) => {
      bucketSec = parseInt(e.target.value, 10);
      historyCols.length = 0;
      activeBucket = null;
    });

    let currentMid = 0;
    const historyCols = [];
    const maxCols = Math.max(60, Math.floor(width / 5));
    let activeBucket = null;

    function getLiquidityColor(norm) {
      if (norm <= 0.05) return 'rgba(0, 31, 63, 0.3)';
      if (norm < 0.3) return `rgba(0, 116, 217, ${0.4 + norm * 1.5})`;
      if (norm < 0.6) return `rgba(46, 204, 64, ${0.6 + norm * 0.5})`;
      if (norm < 0.85) return `rgba(255, 220, 0, ${0.8 + norm * 0.2})`;
      return `rgb(255, 65, 54)`; // Heavy resting wall
    }

    // Step 1: Initial Price Fetch via REST (Immediately loads price)
    fetch('https://fapi.binance.com/fapi/v1/ticker/price?symbol=XAUUSDT')
      .then(res => res.json())
      .then(data => {
        if (data.price) {
          currentMid = parseFloat(data.price);
          priceDisplay.textContent = currentMid.toFixed(2);
        }
      })
      .catch(() => {});

    // Step 2: Live Futures Depth Stream
    const ws = new WebSocket('wss://fstream.binance.com/ws/xauusdt@depth20@250ms');

    ws.onopen = () => {
      statusLabel.textContent = "CONNECTED (LIVE)";
      statusLabel.style.color = "#00ff88";
    };

    ws.onerror = () => {
      statusLabel.textContent = "STREAM RETRYING";
      statusLabel.style.color = "#ff4444";
    };

    ws.onmessage = (evt) => {
      const data = JSON.parse(evt.data);
      const rawBids = data.bids || data.b;
      const rawAsks = data.asks || data.a;

      if (!rawBids || !rawAsks || rawBids.length === 0) return;

      const bids = rawBids.map(b => [parseFloat(b[0]), parseFloat(b[1])]);
      const asks = rawAsks.map(a => [parseFloat(a[0]), parseFloat(a[1])]);

      currentMid = (bids[0][0] + asks[0][0]) / 2;
      priceDisplay.textContent = currentMid.toFixed(2);

      const now = Math.floor(Date.now() / 1000);
      const bucketTime = Math.floor(now / bucketSec) * bucketSec;

      let maxQty = 0.001;
      const snapshot = [];
      bids.forEach(([p, q]) => { maxQty = Math.max(maxQty, q); snapshot.push({ p, q }); });
      asks.forEach(([p, q]) => { maxQty = Math.max(maxQty, q); snapshot.push({ p, q }); });

      if (!activeBucket || activeBucket.time !== bucketTime) {
        activeBucket = {
          time: bucketTime,
          mid: currentMid,
          orders: snapshot,
          maxQty: maxQty
        };
        historyCols.push(activeBucket);
        if (historyCols.length > maxCols) historyCols.shift();
      } else {
        activeBucket.mid = currentMid;
        activeBucket.orders = snapshot;
        activeBucket.maxQty = Math.max(activeBucket.maxQty, maxQty);
      }
    };

    function render() {
      ctx.fillStyle = "#06080d";
      ctx.fillRect(0, 0, width, height);

      const displayMid = currentMid > 0 ? currentMid : 4300;
      const verticalSpread = 15; // +/- $15 range around current price
      const minP = displayMid - verticalSpread;
      const maxP = displayMid + verticalSpread;

      const colWidth = width / maxCols;

      if (historyCols.length > 0) {
        historyCols.forEach((col, idx) => {
          const x = idx * colWidth;

          col.orders.forEach(order => {
            if (order.p >= minP && order.p <= maxP) {
              const y = height - ((order.p - minP) / (maxP - minP)) * height;
              const intensity = Math.min(order.q / (col.maxQty * 0.7), 1);
              ctx.fillStyle = getLiquidityColor(intensity);
              ctx.fillRect(x, y - 2, colWidth + 0.6, 4);
            }
          });

          // Price trajectory line
          const midY = height - ((col.mid - minP) / (maxP - minP)) * height;
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x, midY, colWidth + 0.5, 2);
        });
      }

      // Price Axis Labels
      ctx.fillStyle = "#64748b";
      ctx.font = "10px monospace";
      ctx.textAlign = "right";

      for (let i = 1; i <= 6; i++) {
        const p = minP + ((maxP - minP) * (i / 7));
        const y = height - (i / 7) * height;
        ctx.fillText(p.toFixed(2), width - 8, y - 3);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.06)";
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
