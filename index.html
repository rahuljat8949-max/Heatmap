<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>XAUUSDT Heatmap Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #06080d;
      color: #eaecef;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #0e121a;
      border-bottom: 1px solid #1a202c;
    }
    .left-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #1e2638;
      color: #ffd700;
      font-weight: 700;
      border: 1px solid #334155;
    }
    select {
      background: #141b2d;
      color: #00f0ff;
      border: 1px solid #2d3748;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      outline: none;
    }
    .price-tag {
      font-size: 16px;
      font-weight: bold;
      color: #00ff88;
      font-family: monospace;
    }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 52px);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #legend {
      position: absolute;
      bottom: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #94a3b8;
      background: rgba(6, 8, 13, 0.85);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }
    .gradient-bar {
      width: 55px;
      height: 6px;
      border-radius: 2px;
      background: linear-gradient(to right, #001f3f, #0074d9, #00ffcc, #ffdc00, #ff0055);
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="left-controls">
      <span class="badge">Binance XAUUSDT</span>
      <select id="timeframe-select">
        <option value="1" selected>Live Stream</option>
        <option value="60">1 Min</option>
        <option value="300">5 Min</option>
        <option value="420">7 Min</option>
        <option value="900">15 Min</option>
      </select>
      <span id="status" style="font-size: 10px; color: #f59e0b;">Starting...</span>
    </div>
    <div class="price-tag" id="last-price">Connecting...</div>
  </div>

  <div id="canvas-container">
    <canvas id="heatmapCanvas"></canvas>
    <div id="legend">
      <span>Low Liq</span>
      <div class="gradient-bar"></div>
      <span>Whale Wall</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('heatmapCanvas');
    const ctx = canvas.getContext('2d');
    const priceDisplay = document.getElementById('last-price');
    const statusLabel = document.getElementById('status');
    const tfSelect = document.getElementById('timeframe-select');

    let width = 0, height = 0;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight - 52;
    }
    window.addEventListener('resize', resize);
    resize();

    let bucketSec = parseInt(tfSelect.value, 10);
    tfSelect.addEventListener('change', (e) => {
      bucketSec = parseInt(e.target.value, 10);
    });

    let currentMid = 0;
    const historyCols = [];
    const maxCols = Math.max(90, Math.floor(width / 3.5));
    let lastBucketTime = 0;

    // Intensity color palette
    function getLiquidityColor(norm) {
      if (norm <= 0.05) return 'rgba(0, 31, 63, 0.4)';
      if (norm < 0.25) return `rgba(0, 116, 217, ${0.5 + norm * 1.5})`;
      if (norm < 0.55) return `rgba(0, 255, 204, ${0.7 + norm * 0.5})`;
      if (norm < 0.8) return `rgba(255, 220, 0, ${0.85 + norm * 0.15})`;
      return `rgb(255, 0, 85)`; // Heavy resting wall
    }

    // Direct Futures depth connection
    const ws = new WebSocket('wss://fstream.binance.com/ws/xauusdt@depth20@250ms');

    ws.onopen = () => {
      statusLabel.textContent = "CONNECTED (LIVE)";
      statusLabel.style.color = "#00ff88";
    };

    ws.onerror = () => {
      statusLabel.textContent = "STREAM RETRYING";
      statusLabel.style.color = "#ff4444";
    };

    ws.onmessage = (evt) => {
      const data = JSON.parse(evt.data);
      const rawBids = data.bids || data.b;
      const rawAsks = data.asks || data.a;

      if (!rawBids || !rawAsks || rawBids.length === 0) return;

      const bids = rawBids.map(b => [parseFloat(b[0]), parseFloat(b[1])]);
      const asks = rawAsks.map(a => [parseFloat(a[0]), parseFloat(a[1])]);

      currentMid = (bids[0][0] + asks[0][0]) / 2;
      priceDisplay.textContent = currentMid.toFixed(2);

      const now = Math.floor(Date.now() / 1000);
      const bucketTime = Math.floor(now / bucketSec) * bucketSec;

      let maxQty = 0.001;
      const snapshot = [];
      bids.forEach(([p, q]) => { maxQty = Math.max(maxQty, q); snapshot.push({ p, q }); });
      asks.forEach(([p, q]) => { maxQty = Math.max(maxQty, q); snapshot.push({ p, q }); });

      if (bucketSec === 1 || bucketTime !== lastBucketTime) {
        lastBucketTime = bucketTime;
        historyCols.push({
          mid: currentMid,
          orders: snapshot,
          maxQty: maxQty
        });
        if (historyCols.length > maxCols) historyCols.shift();
      } else {
        const lastCol = historyCols[historyCols.length - 1];
        if (lastCol) {
          lastCol.mid = currentMid;
          lastCol.orders = snapshot;
          lastCol.maxQty = Math.max(lastCol.maxQty, maxQty);
        }
      }
    };

    function render() {
      ctx.fillStyle = "#06080d";
      ctx.fillRect(0, 0, width, height);

      if (currentMid > 0) {
        // Adaptive spread +/- $6 around Gold mid price for high resolution
        const priceSpread = 6;
        const minP = currentMid - priceSpread;
        const maxP = currentMid + priceSpread;
        const colWidth = width / maxCols;

        historyCols.forEach((col, idx) => {
          const x = idx * colWidth;

          col.orders.forEach(order => {
            if (order.p >= minP && order.p <= maxP) {
              const y = height - ((order.p - minP) / (maxP - minP)) * height;
              const intensity = Math.min(order.q / (col.maxQty * 0.6), 1);
              ctx.fillStyle = getLiquidityColor(intensity);
              ctx.fillRect(x, y - 2, colWidth + 0.8, 4);
            }
          });

          // Price Trajectory
          const midY = height - ((col.mid - minP) / (maxP - minP)) * height;
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x, midY, colWidth + 0.5, 2);
        });

        // Price Axis lines
        ctx.fillStyle = "#64748b";
        ctx.font = "10px monospace";
        ctx.textAlign = "right";

        for (let i = 1; i <= 6; i++) {
          const p = minP + ((maxP - minP) * (i / 7));
          const y = height - (i / 7) * height;
          ctx.fillText(p.toFixed(2), width - 8, y - 3);

          ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
