<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>XAUUSDT Liquidity Heatmap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080a10;
      color: #eaecef;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #10141f;
      border-bottom: 1px solid #1c2333;
    }
    .left-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #1b2338;
      color: #f1b90c;
      font-weight: 700;
      border: 1px solid #2e3a55;
    }
    select {
      background: #141b2b;
      color: #00f0ff;
      border: 1px solid #2d384e;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      outline: none;
    }
    .price-tag {
      font-size: 16px;
      font-weight: bold;
      color: #00ff88;
      font-family: monospace;
    }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 52px);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #legend {
      position: absolute;
      bottom: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #94a3b8;
      background: rgba(8, 10, 16, 0.9);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }
    .gradient-bar {
      width: 55px;
      height: 6px;
      border-radius: 2px;
      background: linear-gradient(to right, #001f3f, #0074d9, #00ffcc, #ffdc00, #ff0055);
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="left-controls">
      <span class="badge">Binance XAUUSDT</span>
      <select id="timeframe-select">
        <option value="1m">1m</option>
        <option value="5m" selected>5m</option>
        <option value="15m">15m</option>
      </select>
      <span id="status" style="font-size: 10px; color: #00ff88;">REALTIME</span>
    </div>
    <div class="price-tag" id="last-price">--.--</div>
  </div>

  <div id="canvas-container">
    <canvas id="heatmapCanvas"></canvas>
    <div id="legend">
      <span>Low Liq</span>
      <div class="gradient-bar"></div>
      <span>Whale Cluster</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('heatmapCanvas');
    const ctx = canvas.getContext('2d');
    const priceDisplay = document.getElementById('last-price');
    const statusLabel = document.getElementById('status');
    const tfSelect = document.getElementById('timeframe-select');

    let width = 0, height = 0;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight - 52;
    }
    window.addEventListener('resize', resize);
    resize();

    let currentPrice = 4286.93;
    let candles = [];
    let orderBookLevels = [];
    let currentTf = tfSelect.value;

    tfSelect.addEventListener('change', (e) => {
      currentTf = e.target.value;
      loadHistoricalKlines();
    });

    // 1. Fetch Real Klines (Candlesticks) from Binance Futures
    async function loadHistoricalKlines() {
      try {
        const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=XAUUSDT&interval=${currentTf}&limit=40`);
        const data = await res.json();
        if (Array.isArray(data)) {
          candles = data.map(d => ({
            time: d[0],
            open: parseFloat(d[1]),
            high: parseFloat(d[2]),
            low: parseFloat(d[3]),
            close: parseFloat(d[4]),
            vol: parseFloat(d[5])
          }));
          if (candles.length > 0) {
            currentPrice = candles[candles.length - 1].close;
            priceDisplay.textContent = currentPrice.toFixed(2);
          }
        }
      } catch (err) {}
    }

    // 2. Fetch Live Futures Depth for Real Liquidity Walls
    async function fetchLiquidity() {
      try {
        const res = await fetch('https://fapi.binance.com/fapi/v1/depth?symbol=XAUUSDT&limit=100');
        const data = await res.json();
        if (data.bids && data.asks) {
          const list = [];
          data.bids.forEach(b => list.push({ price: parseFloat(b[0]), qty: parseFloat(b[1]), side: 'bid' }));
          data.asks.forEach(a => list.push({ price: parseFloat(a[0]), qty: parseFloat(a[1]), side: 'ask' }));
          
          let maxQ = 0.001;
          list.forEach(item => { if (item.qty > maxQ) maxQ = item.qty; });
          list.forEach(item => item.norm = item.qty / maxQ);

          orderBookLevels = list;
          if (data.bids[0] && data.asks[0]) {
            currentPrice = (parseFloat(data.bids[0][0]) + parseFloat(data.asks[0][0])) / 2;
            priceDisplay.textContent = currentPrice.toFixed(2);
          }
        }
      } catch (err) {}
    }

    loadHistoricalKlines();
    fetchLiquidity();
    setInterval(fetchLiquidity, 1000);
    setInterval(loadHistoricalKlines, 5000);

    function getHeatmapColor(norm) {
      if (norm < 0.15) return 'rgba(0, 100, 200, 0.25)';
      if (norm < 0.4) return 'rgba(0, 220, 255, 0.45)';
      if (norm < 0.7) return 'rgba(255, 230, 0, 0.7)';
      return 'rgba(255, 30, 80, 0.95)'; // Coinglass red/orange whale band
    }

    function render() {
      ctx.fillStyle = "#080a10";
      ctx.fillRect(0, 0, width, height);

      // Price Spread calculation (+/- $15 from market)
      const range = 14;
      const minP = currentPrice - range;
      const maxP = currentPrice + range;

      const getY = (p) => height - ((p - minP) / (maxP - minP)) * height;

      // 1. Draw Coinglass Horizontal Liquidity Bands across the canvas
      orderBookLevels.forEach(order => {
        if (order.price >= minP && order.price <= maxP) {
          const y = getY(order.price);
          ctx.fillStyle = getHeatmapColor(order.norm);
          ctx.fillRect(0, y - 2, width - 60, 4);
        }
      });

      // 2. Draw Candlesticks on top
      if (candles.length > 0) {
        const chartAreaWidth = width - 65;
        const candleWidth = Math.max(4, (chartAreaWidth / candles.length) * 0.6);
        const gap = chartAreaWidth / candles.length;

        candles.forEach((c, i) => {
          const x = i * gap + 15;
          const openY = getY(c.open);
          const closeY = getY(c.close);
          const highY = getY(c.high);
          const lowY = getY(c.low);

          const isBull = c.close >= c.open;
          ctx.strokeStyle = isBull ? "#00ff88" : "#ff3b69";
          ctx.fillStyle = isBull ? "#00ff88" : "#ff3b69";

          // Wick
          ctx.beginPath();
          ctx.moveTo(x + candleWidth / 2, highY);
          ctx.lineTo(x + candleWidth / 2, lowY);
          ctx.stroke();

          // Body
          const bodyY = Math.min(openY, closeY);
          const bodyH = Math.max(Math.abs(closeY - openY), 2);
          ctx.fillRect(x, bodyY, candleWidth, bodyH);
        });
      }

      // 3. Current Price Dashed Line
      const currentY = getY(currentPrice);
      ctx.strokeStyle = "#ffffff";
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(0, currentY);
      ctx.lineTo(width - 60, currentY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 4. Right Price Axis
      ctx.fillStyle = "#10141f";
      ctx.fillRect(width - 60, 0, 60, height);
      ctx.fillStyle = "#64748b";
      ctx.font = "10px monospace";
      ctx.textAlign = "left";

      for (let i = 1; i <= 8; i++) {
        const p = minP + ((maxP - minP) * (i / 9));
        const y = getY(p);
        ctx.fillText(p.toFixed(2), width - 55, y + 3);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width - 60, y);
        ctx.stroke();
      }

      // Current Price Box on Axis
      ctx.fillStyle = "#00ff88";
      ctx.fillRect(width - 60, currentY - 8, 60, 16);
      ctx.fillStyle = "#000000";
      ctx.font = "bold 10px monospace";
      ctx.fillText(currentPrice.toFixed(2), width - 56, currentY + 4);

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
