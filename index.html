<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>XAUUSDT Heatmap Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #06080d;
      color: #eaecef;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #0e121a;
      border-bottom: 1px solid #1a202c;
    }
    .left-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #1e2638;
      color: #ffd700;
      font-weight: 700;
      border: 1px solid #334155;
    }
    select {
      background: #141b2d;
      color: #00f0ff;
      border: 1px solid #2d3748;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      outline: none;
    }
    .price-tag {
      font-size: 16px;
      font-weight: bold;
      color: #00ff88;
      font-family: monospace;
    }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 52px);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #legend {
      position: absolute;
      bottom: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #94a3b8;
      background: rgba(6, 8, 13, 0.85);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }
    .gradient-bar {
      width: 55px;
      height: 6px;
      border-radius: 2px;
      background: linear-gradient(to right, #001f3f, #0074d9, #00ffcc, #ffdc00, #ff0055);
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="left-controls">
      <span class="badge">Binance XAUUSDT</span>
      <select id="timeframe-select">
        <option value="1" selected>Live Stream</option>
        <option value="60">1 Min</option>
        <option value="300">5 Min</option>
        <option value="420">7 Min</option>
      </select>
      <span id="status" style="font-size: 10px; color: #00ff88;">ACTIVE</span>
    </div>
    <div class="price-tag" id="last-price">4287.50</div>
  </div>

  <div id="canvas-container">
    <canvas id="heatmapCanvas"></canvas>
    <div id="legend">
      <span>Low Liq</span>
      <div class="gradient-bar"></div>
      <span>Whale Wall</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('heatmapCanvas');
    const ctx = canvas.getContext('2d');
    const priceDisplay = document.getElementById('last-price');
    const statusLabel = document.getElementById('status');
    const tfSelect = document.getElementById('timeframe-select');

    let width = 0, height = 0;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight - 52;
    }
    window.addEventListener('resize', resize);
    resize();

    let bucketSec = parseInt(tfSelect.value, 10);
    tfSelect.addEventListener('change', (e) => {
      bucketSec = parseInt(e.target.value, 10);
    });

    let currentMid = 4287.50;
    const historyCols = [];
    const maxCols = Math.max(90, Math.floor(width / 3.5));
    let lastBucketTime = 0;

    function getLiquidityColor(norm) {
      if (norm <= 0.08) return 'rgba(0, 31, 63, 0.4)';
      if (norm < 0.3) return `rgba(0, 116, 217, ${0.5 + norm * 1.5})`;
      if (norm < 0.6) return `rgba(0, 255, 204, ${0.7 + norm * 0.5})`;
      if (norm < 0.85) return `rgba(255, 220, 0, ${0.85 + norm * 0.15})`;
      return `rgb(255, 0, 85)`; // Heavy limit wall
    }

    // Process new snapshot into heatmap
    function pushOrderSnapshot(mid, bids, asks) {
      currentMid = mid;
      priceDisplay.textContent = currentMid.toFixed(2);

      const now = Math.floor(Date.now() / 1000);
      const bucketTime = Math.floor(now / bucketSec) * bucketSec;

      let maxQty = 0.001;
      const snapshot = [];
      bids.forEach(([p, q]) => { maxQty = Math.max(maxQty, q); snapshot.push({ p, q }); });
      asks.forEach(([p, q]) => { maxQty = Math.max(maxQty, q); snapshot.push({ p, q }); });

      if (bucketSec === 1 || bucketTime !== lastBucketTime) {
        lastBucketTime = bucketTime;
        historyCols.push({ mid: currentMid, orders: snapshot, maxQty: maxQty });
        if (historyCols.length > maxCols) historyCols.shift();
      } else {
        const last = historyCols[historyCols.length - 1];
        if (last) {
          last.mid = currentMid;
          last.orders = snapshot;
          last.maxQty = Math.max(last.maxQty, maxQty);
        }
      }
    }

    // Direct REST Polling loop (No WebSocket blocking issues)
    async function fetchBinanceData() {
      try {
        const res = await fetch('https://fapi.binance.com/fapi/v1/depth?symbol=XAUUSDT&limit=50');
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        
        const bids = data.bids.map(b => [parseFloat(b[0]), parseFloat(b[1])]);
        const asks = data.asks.map(a => [parseFloat(a[0]), parseFloat(a[1])]);
        
        if (bids.length && asks.length) {
          const mid = (bids[0][0] + asks[0][0]) / 2;
          pushOrderSnapshot(mid, bids, asks);
          statusLabel.textContent = "LIVE POLLING";
          statusLabel.style.color = "#00ff88";
        }
      } catch (err) {
        // Fallback simulation: Market noise around last known price
        const jitter = (Math.random() - 0.49) * 0.15;
        currentMid = +(currentMid + jitter).toFixed(2);
        
        const simBids = [];
        const simAsks = [];
        for (let i = 1; i <= 25; i++) {
          simBids.push([+(currentMid - (i * 0.3)).toFixed(2), Math.random() * 5 + (i % 5 === 0 ? 15 : 1)]);
          simAsks.push([+(currentMid + (i * 0.3)).toFixed(2), Math.random() * 5 + (i % 6 === 0 ? 18 : 1)]);
        }
        pushOrderSnapshot(currentMid, simBids, simAsks);
        statusLabel.textContent = "SYNTHETIC FEED";
        statusLabel.style.color = "#ffd700";
      }
    }

    // Initial pre-fill so screen is NEVER black
    for (let k = 0; k < 40; k++) {
      const p = currentMid + (Math.sin(k / 5) * 1.5);
      const b = [], a = [];
      for (let i = 1; i <= 20; i++) {
        b.push([p - i * 0.4, Math.random() * 8 + (i % 4 === 0 ? 16 : 1)]);
        a.push([p + i * 0.4, Math.random() * 8 + (i % 5 === 0 ? 14 : 1)]);
      }
      historyCols.push({ mid: p, orders: [...b, ...a], maxQty: 20 });
    }

    // Poll every 600ms
    setInterval(fetchBinanceData, 600);
    fetchBinanceData();

    function render() {
      ctx.fillStyle = "#06080d";
      ctx.fillRect(0, 0, width, height);

      const priceSpread = 8; // +/- $8 spread
      const minP = currentMid - priceSpread;
      const maxP = currentMid + priceSpread;
      const colWidth = width / maxCols;

      if (historyCols.length > 0) {
        historyCols.forEach((col, idx) => {
          const x = idx * colWidth;

          col.orders.forEach(order => {
            if (order.p >= minP && order.p <= maxP) {
              const y = height - ((order.p - minP) / (maxP - minP)) * height;
              const intensity = Math.min(order.q / (col.maxQty * 0.65), 1);
              ctx.fillStyle = getLiquidityColor(intensity);
              ctx.fillRect(x, y - 2, colWidth + 0.8, 3.8);
            }
          });

          // Mid Price Line
          const midY = height - ((col.mid - minP) / (maxP - minP)) * height;
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x, midY, colWidth + 0.5, 2);
        });
      }

      // Price Grid Labels
      ctx.fillStyle = "#64748b";
      ctx.font = "10px monospace";
      ctx.textAlign = "right";

      for (let i = 1; i <= 6; i++) {
        const p = minP + ((maxP - minP) * (i / 7));
        const y = height - (i / 7) * height;
        ctx.fillText(p.toFixed(2), width - 8, y - 3);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
