<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Binance XAUUSDT Heatmap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080a10;
      color: #eaecef;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #0f131d;
      border-bottom: 1px solid #1b2232;
      user-select: none;
    }
    .left-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #1b2338;
      color: #f1b90c;
      font-weight: 700;
      border: 1px solid #2e3a55;
    }
    select {
      background: #141b2b;
      color: #00f0ff;
      border: 1px solid #2d384e;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      outline: none;
    }
    .price-tag {
      font-size: 16px;
      font-weight: bold;
      color: #00ff88;
      font-family: monospace;
    }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 52px);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #legend {
      position: absolute;
      bottom: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #94a3b8;
      background: rgba(8, 10, 16, 0.9);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #1e293b;
      pointer-events: none;
    }
    .gradient-bar {
      width: 60px;
      height: 6px;
      border-radius: 2px;
      background: linear-gradient(to right, #001f3f, #0088ff, #00ffcc, #ffdc00, #ff0055);
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="left-controls">
      <span class="badge">Binance XAUUSDT</span>
      <select id="timeframe-select">
        <option value="1m">1m</option>
        <option value="5m" selected>5m</option>
        <option value="15m">15m</option>
      </select>
      <span id="status" style="font-size: 10px; color: #00ff88;">REALTIME</span>
    </div>
    <div class="price-tag" id="last-price">--.--</div>
  </div>

  <div id="canvas-container">
    <canvas id="heatmapCanvas"></canvas>
    <div id="legend">
      <span>Low</span>
      <div class="gradient-bar"></div>
      <span>Whale Liquidity</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('heatmapCanvas');
    const ctx = canvas.getContext('2d');
    const priceDisplay = document.getElementById('last-price');
    const tfSelect = document.getElementById('timeframe-select');

    let width = 0, height = 0;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight - 52;
    }
    window.addEventListener('resize', resize);
    resize();

    let currentPrice = 4287.00;
    let candles = [];
    let currentTf = tfSelect.value;

    // Heatmap Matrix Memory
    const heatmapHistory = [];
    const MAX_HISTORY = 120;

    // Scrolling & Dragging
    let panOffsetX = 0;
    let panOffsetY = 0;
    let isDragging = false;
    let startX = 0, startY = 0;

    const container = document.getElementById('canvas-container');
    container.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startX = e.clientX - panOffsetX;
      startY = e.clientY - panOffsetY;
    });
    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      panOffsetX = e.clientX - startX;
      panOffsetY = e.clientY - startY;
    });
    window.addEventListener('pointerup', () => { isDragging = false; });
    window.addEventListener('pointercancel', () => { isDragging = false; });

    tfSelect.addEventListener('change', (e) => {
      currentTf = e.target.value;
      panOffsetX = 0;
      panOffsetY = 0;
      loadHistoricalKlines();
    });

    // Real Binance Futures Candles
    async function loadHistoricalKlines() {
      try {
        const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=XAUUSDT&interval=${currentTf}&limit=60`);
        const data = await res.json();
        if (Array.isArray(data)) {
          candles = data.map(d => ({
            time: d[0],
            open: parseFloat(d[1]),
            high: parseFloat(d[2]),
            low: parseFloat(d[3]),
            close: parseFloat(d[4]),
            vol: parseFloat(d[5])
          }));
          if (candles.length > 0) {
            currentPrice = candles[candles.length - 1].close;
            priceDisplay.textContent = currentPrice.toFixed(2);
          }
        }
      } catch (err) {}
    }

    // Real Binance Futures Depth (100 Orderbook Levels)
    async function fetchDepthSnapshot() {
      try {
        const res = await fetch('https://fapi.binance.com/fapi/v1/depth?symbol=XAUUSDT&limit=100');
        const data = await res.json();
        if (data.bids && data.asks) {
          let maxQ = 0.001;
          const levels = [];

          data.bids.forEach(b => {
            const p = parseFloat(b[0]), q = parseFloat(b[1]);
            if (q > maxQ) maxQ = q;
            levels.push({ p, q });
          });
          data.asks.forEach(a => {
            const p = parseFloat(a[0]), q = parseFloat(a[1]);
            if (q > maxQ) maxQ = q;
            levels.push({ p, q });
          });

          if (data.bids[0] && data.asks[0]) {
            currentPrice = (parseFloat(data.bids[0][0]) + parseFloat(data.asks[0][0])) / 2;
            priceDisplay.textContent = currentPrice.toFixed(2);
          }

          heatmapHistory.push({
            time: Date.now(),
            price: currentPrice,
            levels: levels,
            maxQ: maxQ
          });

          if (heatmapHistory.length > MAX_HISTORY) {
            heatmapHistory.shift();
          }
        }
      } catch (err) {}
    }

    loadHistoricalKlines();
    fetchDepthSnapshot();
    setInterval(fetchDepthSnapshot, 1000);
    setInterval(loadHistoricalKlines, 4000);

    // Continuous Spectral Gradient (Coinglass Style)
    function getSpectralColor(norm) {
      if (norm < 0.08) return 'rgba(0, 31, 63, 0.25)';
      if (norm < 0.25) return `rgba(0, 136, 255, ${0.35 + norm * 1.5})`;
      if (norm < 0.55) return `rgba(0, 255, 204, ${0.5 + norm * 0.8})`;
      if (norm < 0.8) return `rgba(255, 220, 0, ${0.75 + norm * 0.25})`;
      return `rgb(255, 0, 85)`; // Massive Whale Wall
    }

    function render() {
      ctx.fillStyle = "#080a10";
      ctx.fillRect(0, 0, width, height);

      const chartAreaWidth = width - 75;

      // Vertical price view window (+/- $16 from mid)
      const visibleRange = 24;
      const baseMid = currentPrice - (panOffsetY / height) * visibleRange;
      const minP = baseMid - (visibleRange / 2);
      const maxP = baseMid + (visibleRange / 2);

      const getY = (p) => height - ((p - minP) / (maxP - minP)) * height;

      // 1. Draw Dense Liquidity Heatmap Matrix (Real Orders)
      if (heatmapHistory.length > 0) {
        const sliceWidth = chartAreaWidth / MAX_HISTORY;

        heatmapHistory.forEach((snap, snapIdx) => {
          const x = snapIdx * sliceWidth + panOffsetX;
          if (x < -10 || x > chartAreaWidth + 10) return;

          snap.levels.forEach(order => {
            if (order.p >= minP && order.p <= maxP) {
              const y = getY(order.p);
              const intensity = Math.min(order.q / (snap.maxQ * 0.7), 1);
              ctx.fillStyle = getSpectralColor(intensity);
              ctx.fillRect(x, y - 1, sliceWidth + 0.8, 3.2);
            }
          });
        });
      }

      // 2. Draw Candlesticks on top of heatmap
      if (candles.length > 0) {
        const candleSpacing = 15;
        const candleWidth = 8;
        const startXCandle = chartAreaWidth - (candles.length * candleSpacing) + panOffsetX;

        candles.forEach((c, i) => {
          const x = startXCandle + (i * candleSpacing);
          if (x < -15 || x > chartAreaWidth + 15) return;

          const openY = getY(c.open);
          const closeY = getY(c.close);
          const highY = getY(c.high);
          const lowY = getY(c.low);

          const isBull = c.close >= c.open;
          ctx.strokeStyle = isBull ? "#00ff88" : "#ff3b69";
          ctx.fillStyle = isBull ? "#00ff88" : "#ff3b69";

          // Wick
          ctx.beginPath();
          ctx.moveTo(x + candleWidth / 2, highY);
          ctx.lineTo(x + candleWidth / 2, lowY);
          ctx.stroke();

          // Body
          const bodyY = Math.min(openY, closeY);
          const bodyH = Math.max(Math.abs(closeY - openY), 2);
          ctx.fillRect(x, bodyY, candleWidth, bodyH);
        });
      }

      // 3. Current Price Dashed Line
      const currentY = getY(currentPrice);
      ctx.strokeStyle = "#ffffff";
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(0, currentY);
      ctx.lineTo(chartAreaWidth, currentY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 4. Right Price Axis
      ctx.fillStyle = "#0f131d";
      ctx.fillRect(chartAreaWidth, 0, 75, height);
      ctx.fillStyle = "#64748b";
      ctx.font = "10px monospace";
      ctx.textAlign = "left";

      for (let i = 1; i <= 9; i++) {
        const p = minP + ((maxP - minP) * (i / 10));
        const y = getY(p);
        ctx.fillText(p.toFixed(2), chartAreaWidth + 6, y + 3);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(chartAreaWidth, y);
        ctx.stroke();
      }

      // 5. Current Price Marker
      ctx.fillStyle = "#00ff88";
      ctx.fillRect(chartAreaWidth, currentY - 9, 75, 18);
      ctx.fillStyle = "#000000";
      ctx.font = "bold 11px monospace";
      ctx.fillText(currentPrice.toFixed(2), chartAreaWidth + 5, currentY + 4);

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
